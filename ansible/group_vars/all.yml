postgresql_version: "18"

# Debian/Ubuntu-specific layout — postgresql-common keeps config
# outside PGDATA, unlike most other distros. See docs/DECISIONS.md.
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
postgresql_config_dir: "/etc/postgresql/{{ postgresql_version }}/main"
postgresql_bin_dir: "/usr/lib/postgresql/{{ postgresql_version }}/bin"

postgresql_port: 5432

# Must match terraform/variables.tf's network_cidr — no automatic link
# between the two tools yet. See docs/DECISIONS.md.
cluster_network_cidr: "192.168.100.0/24"

postgres_superuser_password: "{{ vault_postgres_superuser_password }}"
